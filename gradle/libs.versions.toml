[versions]
agp = "8.11.2"
kotlin = "2.3.0" #https://kotlinlang.org/docs/releases.html
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.2"
composeBom = "2025.08.01" # Don't update yet!!!! Removes icons
lottie = "6.7.1" #https://airbnb.io/lottie/#/android-compose
navigation-compose = "2.9.6" #https://developer.android.com/develop/ui/compose/navigation
coil-compose = "3.3.0"
koin = "4.1.1"
detekt = "1.23.8"
detekt-rules-compose = "0.5.3"
detekt-rules-ktlint = "2.0.0-alpha.1"
ktor-client = "3.3.1"
datastore = "1.2.0"
tink = "1.20.0"
chucker = "4.2.0"
timber = "5.0.1"
stability-analyzer = "0.6.5"
immutable-collections = "0.4.0"
zxing = "4.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
immutable-collections = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutable-collections" }
zxing = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing"}

#region DataStore
datastore = { group = "androidx.datastore", name = "datastore-preferences-android", version.ref = "datastore" }
#endregion

#region Compose
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil-compose" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil-compose" }
#endregion

#region Dependency Injection
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
#endregion

#region Fonts
ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
#endregion

#region Detekt
detekt-compose-rules = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "detekt-rules-compose" }
detekt-rules-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
detekt-rules-ktlint = { group = "dev.detekt", name = "detekt-rules-ktlint-wrapper", version.ref = "detekt-rules-ktlint" }
detekt-rules-libraries = { group = "io.gitlab.arturbosch.detekt", name = "detekt-rules-libraries", version.ref = "detekt" }
detekt-rules-ruleauthors = { group = "io.gitlab.arturbosch.detekt", name = "detekt-rules-ruleauthors", version.ref = "detekt" }
#endregion

#region Network
ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor-client" }
ktor-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor-client" }
ktor-contentNegotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor-client" }
ktor-serialization-jackson = { group = "io.ktor", name = "ktor-serialization-jackson", version.ref = "ktor-client" }
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor-client" }
#endregion

#region Crypto
tink = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
#endregion

#region Debug
chucker-debug = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-release = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
#endregion

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "stability-analyzer"}